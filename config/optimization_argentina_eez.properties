# constellation-toolkit configuration used by the constellation-design programs
# (AccessVsRAANAndPhase, AreaOptimization, deoptimization.DEMain, saoptimization.SAOptimization).
# Values are those of the author's configuration at publication time; paths were made relative to
# the repository root (run the programs from there). Keys are documented in
# config/throughput_experiment.properties.

# Basic configs:
output_path=results/access_vs_raan_and_phase/
orekit_data_path=orekit-data/
satellites_file=inputs/satellites/constellation_baseline.csv
use_roi_file=true
roi_path=inputs/rois/argentina_eez.csv
propagate_internally=true
positions_path=
start_date=2025-12-04T11:10:00.000
end_date=2025-12-04T12:10:00.000
time_step_seconds=30
visibility_threshold=45
max_subset_size=4
polygon_segments=40
save_snapshot=false
save_geographic=false
save_euclidean=false
snapshot_time_milliseconds=1500000

# Advanced configs [do not modify]:
debug_mode=true
th_detection=0.01
polygon_epsilon=0.0001
lambda_exclusion=3
