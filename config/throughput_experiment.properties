# constellation-toolkit configuration for the LoRa throughput experiment (LoraConstellationSimulator / Main).
# Paths are relative to the directory the Java program is launched from (the repository root).
#
# IMPORTANT: LoraConstellationSimulator overrides output_path, the satellite list and the ROI with its
# command-line arguments, but the coverage time series is computed with start_date, end_date,
# time_step_seconds and visibility_threshold FROM THIS FILE. Keep them equal to the -start, -end,
# -time-step and -vt values passed on the command line (defaults: 2025-01-01T16:00:00.000,
# 2025-01-01T16:30:00.000, 15 s, 20 deg).

# Basic configs:
# Folder for coverage outputs (overridden by -o).
output_path=results/
# Orekit data folder (https://github.com/santiagohenn/orekit-data or https://www.orekit.org).
orekit_data_path=orekit-data/
# Satellites CSV (overridden by -s): date,a[m],e,i[deg],RAAN[deg],arg.perigee[deg],true anomaly[deg]
satellites_file=inputs/satellites.csv
# ROI from file (true) or from the -roi spherical cap (overridden by LoraConstellationSimulator).
use_roi_file=false
roi_path=
# Propagate orbits with Orekit (true) or read ephemerides from positions_path (false).
propagate_internally=true
positions_path=
# Scenario interval (ISO 8601, UTC) and propagation step [s].
start_date=2025-01-01T16:00:00.000
end_date=2025-01-01T16:30:00.000
time_step_seconds=15
# Minimum elevation angle [deg] for a satellite to cover a point.
visibility_threshold=20
# Number of coverage columns (1..max_subset_size satellites) in coverage_<hash>.csv.
max_subset_size=3
# Polygon approximation resolution. NOTE: the value used for the publication is not recorded in the
# repository (the original template left it blank); 150 matches the -roi segment count used by Main.
polygon_segments=150
# Optional outputs: access-area polygons at snapshot_time_milliseconds after start_date, geographic
# and Euclidean coordinates of the polygons (large files).
save_snapshot=true
save_geographic=true
save_euclidean=false
snapshot_time_milliseconds=600000

# Advanced configs [do not modify] (internal parameters of constellation-toolkit):
debug_mode=true
th_detection=0.001
polygon_epsilon=0.0001
lambda_exclusion=3
