# Basic configs:
output_path=<Output Path>
orekit_data_path=<Path to Orekit Data>
satellites_file=<Path to Satellites File>
use_roi_file=<true/false: Wheter to use a custom ROI file>
roi_path=<custom ROI polygon file>
propagate_internally=<true/false: Whether to propagate satellites internally>
positions_path=<If propagate_internally is false, path to ephemeris file>
start_date=2025-01-01T16:00:00.000
end_date=2025-01-01T16:30:00.000
time_step_seconds=15
visibility_threshold=20
max_subset_size=3
polygon_segments=<Number of segments for polygon approximation>
save_snapshot=true
save_geographic=true
save_euclidean=false
snapshot_time_milliseconds=600000

# Advanced configs [do not modify]:
debug_mode=true
th_detection=0.001
polygon_epsilon=0.0001
lambda_exclusion=3

# you can clone orekit-data from https://github.com/santiagohenn/orekit-data